<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">KDP Digger logo</title>
<desc id="desc">Golden book with a magnifying glass, rising bars and a crown.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC400"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE79A"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF5"/><stop offset="1" stop-color="#E8E1D2"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".28"/></filter>
</defs>
<rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
<g opacity=".8" fill="#FFF" stroke="#FFF">
  <path d="M128 26l5 12 13-4-2 13 13 3-10 9 8 10-14 1-3 13-10-8-10 8-3-13-14-1 8-10-10-9 13-3-2-13 13 4z" opacity=".9"/>
</g>
<!-- crown -->
<g filter="url(#shadow)">
  <path d="M91 65l13 14 24-25 24 25 13-14 5 33H86z" fill="#FFD447" stroke="#7A4B00" stroke-width="4" stroke-linejoin="round"/>
  <path d="M88 98h80l-6 12H94z" fill="#FFE79A" stroke="#7A4B00" stroke-width="4"/>
  <circle cx="91" cy="63" r="5" fill="#FFF3B0" stroke="#7A4B00" stroke-width="3"/>
  <circle cx="128" cy="52" r="5" fill="#FFF3B0" stroke="#7A4B00" stroke-width="3"/>
  <circle cx="165" cy="63" r="5" fill="#FFF3B0" stroke="#7A4B00" stroke-width="3"/>
</g>
<!-- open book -->
<g filter="url(#shadow)">
  <path d="M34 151c22-12 43-12 70 3v70c-27-15-48-15-70-3z" fill="url(#book)" stroke="#6B4A1E" stroke-width="5"/>
  <path d="M222 151c-22-12-43-12-70 3v70c27-15 48-15 70-3z" fill="url(#book)" stroke="#6B4A1E" stroke-width="5"/>
  <path d="M104 154c9 4 16 6 24 6s15-2 24-6v70c-9 4-16 6-24 6s-15-2-24-6z" fill="#F7F1E5" stroke="#8A6A39" stroke-width="3"/>
  <g stroke="#B6A27C" stroke-width="3" opacity=".75">
    <path d="M47 169c17-7 34-6 54 3M47 184c17-7 34-6 54 3M47 199c17-7 34-6 54 3"/>
    <path d="M209 169c-17-7-34-6-54 3M209 184c-17-7-34-6-54 3M209 199c-17-7-34-6-54 3"/>
  </g>
</g>
<!-- magnifying glass and market bars -->
<g filter="url(#shadow)">
  <circle cx="133" cy="129" r="49" fill="#FFF" fill-opacity=".94" stroke="#6B4A1E" stroke-width="6"/>
  <circle cx="133" cy="129" r="37" fill="#FFF9E8" stroke="#E0A400" stroke-width="3"/>
  <g fill="#E7A900">
    <rect x="111" y="139" width="9" height="16" rx="2"/>
    <rect x="124" y="128" width="9" height="27" rx="2"/>
    <rect x="137" y="115" width="9" height="40" rx="2"/>
    <rect x="150" y="103" width="9" height="52" rx="2"/>
  </g>
  <path d="M160 156l31 31" stroke="#6B4A1E" stroke-width="13" stroke-linecap="round"/>
  <path d="M164 160l27 27" stroke="#E6A600" stroke-width="5" stroke-linecap="round"/>
  <path d="M116 142l22-24" stroke="#E6A600" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>